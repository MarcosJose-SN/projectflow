services:

  postgres:
    image: postgres:16
    container_name: projectflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - projectflow-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: projectflow-backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
    container_name: projectflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  projectflow-postgres-data: